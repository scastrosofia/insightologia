<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Insightología — El Ojo de Iberoamérica</title>

  <!-- Google Fonts: Open Sans 400, 600, 700, 800 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=20261001-3">
  
  <!-- GSAP 3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <!-- SVG Filter for glass and smoke turbulence/distortion (oculto fuera de flujo) -->
  <svg class="svg-filters" aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;">
    <defs>
      <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence id="feTurbulence" type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="3" result="noise" seed="2" />
        <feDisplacementMap id="feDisplacement" in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- Pantalla de carga mística: Abriendo la mirada... (abriendo.webp) -->
  <aside id="preloader" class="preloader" aria-live="polite" aria-busy="true">
    <div class="preloader-stage">
      <img class="preloader-bg" src="assets/abriendo.webp" alt="Abriendo la mirada..." draggable="false">
      <div class="preloader-controls">
        <div class="preloader-bar-track">
          <div id="preloader-bar-fill" class="preloader-bar-fill"></div>
        </div>
        <div id="preloader-percent" class="preloader-percent">0%</div>
      </div>
    </div>
  </aside>

  <div id="viewport-wrapper">
    <!-- The 16:9 Stage -->
    <main id="stage" aria-label="Escenario del Oráculo Insightología">
      
      <!-- 1. Background scene (adaptable a desktop 16:9 y mobile 9:16) -->
      <picture id="layer-scene-picture" class="stage-layer">
        <source media="(max-width: 768px)" srcset="assets/escena-mobile.webp">
        <source media="(orientation: portrait)" srcset="assets/escena-mobile.webp">
        <img id="layer-scene" class="stage-layer-img" src="assets/escena.webp" alt="Escena del Oráculo" draggable="false">
      </picture>

      <!-- Destello suave del tercer ojo (posicionado con --eye-x, --eye-y) -->
      <div id="third-eye-glow" aria-hidden="true"></div>

      <!-- 2. Crystal ball content (circular clipped, --ball-x, --ball-y, --ball-size) -->
      <div id="ball-content" aria-live="polite">
        <!-- Plasma glow background inside the ball -->
        <div id="ball-plasma"></div>
        <div id="ball-plasma-core"></div>
        
        <!-- Canvas for subtle violet/blue mystical particles/smoke -->
        <canvas id="particles-canvas"></canvas>

        <!-- Container for revealing the oracle answer -->
        <div id="phrase-container" class="phrase-container">
          <div id="phrase-text" class="phrase-text"></div>
          <div id="phrase-credit" class="phrase-credit"></div>
        </div>
      </div>

      <!-- 3. Hands layer (adaptable a desktop 16:9 y mobile 9:16) -->
      <picture id="layer-hands-picture" class="stage-layer">
        <source media="(max-width: 768px)" srcset="assets/manos-mobile.png">
        <source media="(orientation: portrait)" srcset="assets/manos-mobile.png">
        <img id="layer-hands" class="stage-layer-img" src="assets/manos.png" alt="Manos del Oráculo" draggable="false">
      </picture>

      <!-- Capa del gato con transparencia alfa real, autoplay y loop continuo -->
      <img id="layer-cat" class="stage-layer" src="assets/gato.webp" alt="Gato místico" draggable="false">

      <!-- 4. Left side UI: Chat Pill Input positioned over the background artwork -->
      <aside id="input-panel">
        <form id="oracle-form" class="pill-form" onsubmit="return false;">
          <input 
            type="text" 
            id="user-input" 
            class="pill-input" 
            placeholder="¿Qué querés saber sobre el futuro?..." 
            autocomplete="off" 
            spellcheck="false" 
            aria-label="Pregunta al oráculo"
            maxlength="200"
          >
          <div class="pill-actions">
            <button 
              type="button" 
              id="btn-mic" 
              class="pill-btn btn-mic" 
              title="Dictar pregunta (Voz)" 
              aria-label="Dictar por voz"
            >
              <svg class="icon-mic" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
              <span class="mic-wave" aria-hidden="true"></span>
            </button>
            <button 
              type="submit" 
              id="btn-send" 
              class="pill-btn btn-send" 
              title="Consultar al oráculo" 
              aria-label="Consultar al oráculo"
            >
              <svg class="icon-send" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
          </div>
        </form>

        <div id="mic-status" class="mic-status" aria-live="polite"></div>
      </aside>

      <!-- Element for floating question animation toward crystal ball -->
      <div id="floating-question" aria-hidden="true"></div>

    </main>

    <!-- Botón de Mute/Unmute fijo en el viewport -->
    <button id="btn-sound" class="btn-sound" type="button" aria-label="Silenciar sonido" title="Silenciar sonido">
      <svg class="icon-sound-on" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg class="icon-sound-off" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display:none;">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </button>

    <!-- Controls during REVEAL: "Hacer otra pregunta" button (fijo en el viewport) -->
    <div id="reveal-controls">
      <button id="btn-reset" class="btn-reset" type="button">
        Hacer otra pregunta
      </button>
    </div>
  </div>

  <!-- Pistas de audio para ambiente sonoro combinado -->
  <audio id="audio-wind" src="assets/audio/mystic-wind.mp3" loop preload="auto"></audio>
  <audio id="audio-office" src="assets/audio/office-ambience.mp3" loop preload="auto"></audio>

  <script src="config.js?v=20261001-3"></script>
  <script src="app.js?v=20261001-3"></script>
</body>
</html>
